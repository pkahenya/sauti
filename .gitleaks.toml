# Secret scan rules for Sauti.
# This repository is public. Anything these rules match must never be committed.
title = "Sauti secret scan"

[extend]
useDefault = true

[[rules]]
id = "intasend-api-key"
description = "IntaSend API key"
regex = '''\bIS(?:SecretKey|PubKey)_(?:live|test)_[A-Za-z0-9_\-]{10,}'''
keywords = ["issecretkey_", "ispubkey_"]

[[rules]]
id = "credential-assignment"
description = "A key, secret, token, passkey or password given a value in code or config"
regex = '''(?i)\b[a-z0-9_.\-]*(?:key|secret|token|passkey|password|passwd|pwd)\b['"]?\s*[:=]\s*['"]?([A-Za-z0-9_\-+/=.]{12,})'''
secretGroup = 1
entropy = 3.0
keywords = ["key", "secret", "token", "passkey", "password", "passwd", "pwd"]

[[rules]]
id = "url-api-key"
description = "API key inside a URL, such as a Solana RPC endpoint"
regex = '''(?i)[?&](?:api[_\-]?key|apikey|key|token)=([A-Za-z0-9_\-]{16,})'''
secretGroup = 1
keywords = ["key=", "token="]

[[rules]]
id = "solana-keypair-array"
description = "Solana keypair file contents (64 numbers)"
regex = '''\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'''

[[rules]]
id = "base58-private-key"
description = "Base58 private key next to a key, secret, signer or wallet label"
regex = '''(?i)(?:private|secret|signer|wallet)[a-z_\s"']{0,20}[:=]\s*['"]?([1-9A-HJ-NP-Za-km-z]{80,90})'''
secretGroup = 1
keywords = ["private", "secret", "signer", "wallet"]

[[rules]]
id = "recovery-phrase"
description = "Wallet recovery phrase"
regex = '''(?i)(?:mnemonic|seed[ _\-]?phrase|recovery[ _\-]?phrase|secret[ _\-]?phrase)['"]?\s*[:=]\s*['"]?((?:[a-z]+\s+){11,23}[a-z]+)'''
secretGroup = 1
keywords = ["mnemonic", "seed", "recovery", "phrase"]

[[rules]]
id = "kenyan-phone-number"
description = "Kenyan mobile number (personal data stays out of this repository)"
regex = '''(?:\+254|\b254|\b0)\s?[17]\d{2}\s?\d{3}\s?\d{3}\b'''

[[rules]]
id = "ipv4-address"
description = "IPv4 address (server details stay out of this repository)"
regex = '''\b(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b'''
[[rules.allowlists]]
regexes = ['''^(?:127\.0\.0\.1|0\.0\.0\.0)$''']

[[allowlists]]
description = "Placeholders and lockfiles"
regexes = ['''(?i)your[_\-a-z]*here''', '''(?i)^(?:example|changeme|placeholder|x{6,})$''']
paths = ['''(?:^|/)Cargo\.lock$''']
